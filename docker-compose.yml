version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: lexirag-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: lexirag-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/lexirag
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - mongo
      - ai-service
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads

  ai-service:
    build: ./ai-service
    container_name: lexirag-ai-service
    restart: unless-stopped
    env_file: ./ai-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ai_vector_store:/app/vector_store
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: lexirag-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
  ai_vector_store:
